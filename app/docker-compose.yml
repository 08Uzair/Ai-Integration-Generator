services:
  mcp-server:
    build: ./mcp-server
    container_name: myapp-mcp
    restart: unless-stopped
    environment:
      MCP_SERVER_PORT: 5000
      TARGET_API_BASE_URL: http://localhost:8100
      TARGET_API_AUTH_TYPE: none
      # Fill these with your real credentials (or use a .env file at repo root).
      TARGET_API_TOKEN: ${TARGET_API_TOKEN:-}
      TARGET_API_API_KEY: ${TARGET_API_API_KEY:-}
      TARGET_API_AUTH_HEADER_VALUE: ${TARGET_API_AUTH_HEADER_VALUE:-}
      TARGET_API_BASIC_USERNAME: ${TARGET_API_BASIC_USERNAME:-}
      TARGET_API_BASIC_PASSWORD: ${TARGET_API_BASIC_PASSWORD:-}
    ports:
      - "5000:5000"

  ai-server:
    build: ./ai-server
    container_name: myapp-ai
    restart: unless-stopped
    depends_on:
      - mcp-server
    environment:
      AI_SERVER_PORT: 4000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_MODEL_FALLBACK: llama-3.3-70b-versatile
      MCP_SERVER_URL: http://mcp-server:5000/mcp
      # The AiChat component is copied into YOUR app - allow any origin.
      CORS_ORIGINS: '*'
    ports:
      - "4000:4000"
